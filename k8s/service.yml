apiVersion: v1
kind: Service
metadata:
  name: api-ble-service
spec:
  type: NodePort
  selector:
    app: api-ble
  ports:
    - protocol: TCP
      port: 8080        # Puerto expuesto por el servicio
      targetPort: 8080  # Puerto interno del contenedor
      nodePort: 30080   # Puerto abierto en todos los workers para probar la API